function hud(){const st=$("#stage-pill"),sc=$("#score"),kp=$("#key-pill");if(section==="pre"){st.textContent="📝 旅程前測";sc.textContent="—";kp.textContent=`題目 ${Math.min(idx+1,3)} / 3`}else if(section==="post"){st.textContent="✨ 旅程後測";sc.textContent="—";kp.textContent=`題目 ${Math.min(idx+1,3)} / 3`}else{let n=+section-1;st.textContent=stages[n].name;sc.textContent=stageScores[n];kp.innerHTML=`🔑 <span class="key-row">${keys[n]} / 3　${[0,1,2].map(i=>`<i class="key ${i>=keys[n]?"empty":""}">${i<keys[n]?"✦":"·"}</i>`).join("")}</span>`}}
function talk(name,text,show=true,label="繼續　›"){ $("#speaker").textContent=name;$("#line").textContent=text;action.classList.toggle("hidden",!show);action.textContent=label; }
function renderTitle(){phase="title";section="pre";idx=0;hud();screen.innerHTML=`<p class="eyebrow">✦　星星鐘停止的夜晚　✦</p><h1>小小夢魔<br>速率夢旅館</h1><p class="lead">一段溫暖的視覺小說 × 速率解謎冒險</p><div class="rule">速率 ＝ 距離 ÷ 時間</div><button class="primary" id="start">開始夢旅　✦</button><p class="small">3 題前測 · 2 關各 3 個單元 · 3 題後測</p>`;$("#start").onclick=startGame;talk("小夢魔 阿露","歡迎來到夢旅館！完成前測、穿過兩關並收集六把鑰匙，最後再看看自己的進步。",false)}
function renderStory(){phase="story";hud();const page=story[storyIdx];screen.innerHTML=`<p class="eyebrow">✦　${esc(section==="pre"?"旅館序章":section==="post"?"旅程尾聲":stages[+section-1].name)}　✦</p><h2>${esc(page.n)}</h2><p class="lead">${esc(page.t)}</p>${section==="pre"&&storyIdx===1?'<div class="rule">速率＝距離÷時間　｜　距離＝速率×時間　｜　時間＝距離÷速率</div>':""}<p class="small">讀完故事後，按右下角繼續。</p>`;talk(page.n,page.t,true,storyIdx===story.length-1?"開始單元　›":"繼續故事　›")}
function question(){phase="question";hud();currentQuestion=section==="pre"?pretest[idx]:section==="post"?posttest[idx]:stages[+section-1].units[idx];let title=section==="pre"?"旅程前測":section==="post"?"旅程後測":stages[+section-1].name;let label=`${title}　｜　單元 ${idx+1} / 3`;let instr=section==="pre"?"照直覺作答，前測不扣分。":section==="post"?"用剛才練習的方法，完成最後幾題。":"答對可取得鑰匙；首次答對 100 分，每多試一次少 20 分（最低 40 分）。";let input=Object.hasOwn(currentQuestion,"number");let answers=input?`<p class="eyebrow">✍️　輸入計算結果</p><form id="number-form" class="number-row"><label class="sr" for="number-input">答案數字</label><input id="number-input" type="number" inputmode="decimal" step="any" placeholder="輸入數字" required><span class="unit">${esc(currentQuestion.unit)}</span><button class="primary" type="submit">確認答案　✓</button></form>`:`<div class="choices">${currentQuestion.o.map((x,i)=>`<button class="answer" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span>${esc(x)}</button>`).join("")}</div>`;screen.innerHTML=`<p class="eyebrow">✦　${esc(label)}　✦</p><h2>${esc(currentQuestion.q)}</h2><p>${instr}</p>${answers}`;talk("小夢魔 阿露",section==="pre"?"來，選一個你現在認為正確的答案吧。":"先找出題目中的距離、速率和時間，再開始解題。",false);screen.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>submitAnswer(+b.dataset.choice));let form=$("#number-form");if(form)form.onsubmit=e=>{e.preventDefault();submitNumber()};if(form)$("#number-input").focus({preventScroll:true})}
function submitNumber(){const raw=$("#number-input").value;if(raw===""){talk("小夢魔 阿露","請輸入一個數字，再按確認答案。",false);return}const target=+currentQuestion.number;submitAnswer(Math.abs(+raw-target)<1e-7)}
function submitAnswer(value){let ok=section==="pre"||section==="post"?value===currentQuestion.a:value===true||value===currentQuestion.a;if(section==="pre"){if(ok)preScore++;correctNow=ok;phase="feedback";screen.innerHTML=`<p class="eyebrow">📝　已記錄你的想法</p><h2>前測答案已記下來</h2><p class="lead">前測先記錄目前的想法，不顯示對錯。學習後會用另一組題目再試一次。</p>`;talk("小夢魔 阿露","謝謝你先用自己的想法試試看！",false, "記下來　›")}else if(section==="post"){if(ok)postScore++;correctNow=ok;phase="feedback";screen.innerHTML=`<p class="eyebrow">✦　答案已記錄　✦</p><h2>後測答案已記下來</h2><p class="lead">最後一題結束後，就會看到自己的前後測比較。</p>`;talk("小夢魔 阿露","旅程快完成了，繼續往前吧！",true,"下一題　›")}else{attempts++;if(ok){let n=+section-1,earned=Math.max(40,100-(attempts-1)*20);stageScores[n]+=earned;keys[n]++;correctNow=true;phase="feedback";screen.innerHTML=`<p class="eyebrow">✦　單元完成　✦</p><h2><span class="keytag">🔑</span>鑰匙到手！</h2><div class="feedback good"><b>答對了，獲得 ${earned} 分。</b><br>${esc(currentQuestion.why)}</div><p class="small">本關已取得 ${keys[n]} / 3 把鑰匙。</p>`;talk("小夢魔 阿露","太棒了，鑰匙出現了！每關集滿三把鑰匙就能打開下一扇門。",true,"收下鑰匙　✦")}else{correctNow=false;phase="feedback";const help=attempts>=2?currentQuestion.why:"先找出題目中的距離和時間，想想要用除法還是乘法。";screen.innerHTML=`<p class="eyebrow">🌱　再想一想　</p><h2>沒關係，我們一起找線索</h2><div class="feedback retry"><b>提示</b><br>${esc(help)}</div><button class="quiet" id="retry">回到題目，再試一次　↻</button>`;$("#retry").onclick=question;talk("小夢魔 阿露","學新方法本來就需要練習。看一看線索，再試一次。",false)} }hud()}
function advance(){if(phase==="story"){storyIdx++;if(storyIdx<story.length)renderStory();else{idx=0;attempts=0;question()}}else if(phase==="feedback"){if(section==="pre"){idx++;if(idx>=pretest.length){section="1";storyIdx=0;story=[{n:"小夢魔 阿露",t:"前測已經記錄完成！現在來練習三個重要關係：速率＝距離÷時間，距離＝速率×時間，時間＝距離÷速率。"},{n:"小夢魔 阿露",t:"每解出一個單元，就能拿到一把鑰匙。答錯可以看提示、再試一次。兩關都集滿三把鑰匙後，再用新題目完成後測。"}];renderStory()}else question()}else if(section==="post"){idx++;if(idx>=posttest.length)finalScreen();else question()}else{let n=+section-1;idx++;attempts=0;if(idx>=stages[n].units.length){if(n===0){section="2";idx=0;storyIdx=0;story=[{n:"小夢魔 阿露",t:`第一關完成！三盞走廊燈都亮起來了，這一關拿到 ${stageScores[0]} 分。休息一下，我們出發去星光月台。`},...stages[1].intro];renderStory()}else{section="post";idx=0;storyIdx=0;story=[{n:"小夢魔 阿露",t:"兩扇大門都打開了！完成最後三題，就能看見這趟夢旅的學習成果。"}];renderStory()}}else question()}}}
function finalScreen(){phase="final";hud();const delta=postScore-preScore;const msg=delta>0?`答對題數增加 ${delta} 題！每一次練習，都讓你更熟悉速率。`:delta===0?"你維持了原有表現，也已經完成速率練習。":"這次少答對 "+Math.abs(delta)+" 題。別急，可以重玩並留意單位和公式。";screen.innerHTML=`<p class="eyebrow">✦　夢旅館重新亮起來了　✦</p><h2>你的速率進步成果</h2><div class="result-grid"><div class="result-card"><strong>旅程前・前測</strong><b>${preScore} / 3 題</b><div class="bar"><i style="width:${preScore/3*100}%"></i></div></div><div class="result-card"><strong>旅程後・後測</strong><b>${postScore} / 3 題</b><div class="bar"><i style="width:${postScore/3*100}%"></i></div></div></div><p class="lead">${esc(msg)}</p><p class="small">第一關：${stageScores[0]} / 300 分　｜　第二關：${stageScores[1]} / 300 分　｜　🔑 共收集 6 把鑰匙</p><button class="primary" id="restart">再玩一次　↻</button>`;$("#restart").onclick=startGame;talk("小夢魔 阿露","你帶回了六把鑰匙，也完成了一次新的學習旅程！前後測呈現這次遊戲的答題結果。",false)}
function startGame(){preScore=postScore=0;stageScores=[0,0];keys=[0,0];idx=0;attempts=0;section="pre";story=[{n:"小夢魔 阿露",t:"哈囉，旅人！我是阿露，夢旅館的夜班小幫手。今晚星星鐘停了，出口也被六把小鑰匙鎖住。"},{n:"小夢魔 阿露",t:"這是一場安心的解謎旅行。你可以慢慢想、看提示、再試一次。途中會練習速率，最後看看自己的進步。"},{n:"阿澄",t:"我先用自己的想法試試看！如果算錯，等一下再學會方法也可以。"}];storyIdx=0;renderStory()}
action.addEventListener("click",advance);renderTitle();
</script>
</body>
</html>
