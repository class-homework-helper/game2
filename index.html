function title(){state.phase="title";state.chapter=-1;hud();shell(`<div class="paper-card cover"><div class="seal">✦　🕰️　✦</div><p class="eyebrow">一場閱讀故事、探索地圖與速率戰鬥的 RPG</p><h1>小小夢魔<br>星鐘守望者</h1><p class="lead">星鐘碎裂，夢境迷路。成為見習旅人，沿著燈火走廊前往星光月台，幫阿露找回失落的指針。</p><div class="rule">探索地圖　·　讀懂故事　·　用數學打開道路</div><button class="primary" id="new-game">開啟夢旅　✦</button><p class="small">兩章冒險・六場遭遇・六把鑰匙・前後測成果</p></div>`);$("#new-game").onclick=startGame;talk("小夢魔 阿露","星鐘正等著新的守望者。準備好踏進夢境了嗎？",false)}
function startGame(){Object.assign(state,{phase:"dialogue",chapter:-1,encounter:0,node:0,unlocked:0,chapter2:false,done:Array(6).fill(false),storyIndex:0,storyChoice:false,hp:3,maxHp:3,potion:0,hints:0,xp:0,level:1,score:[0,0],keys:[0,0],attempts:0,preIndex:0,preScore:0,postIndex:0,postScore:0,hintText:""});const intro=[{scene:"序章・裂開的星鐘",speaker:"旁白",text:"夜色落在夢旅館，牆上的星鐘忽然發出清脆的裂響。六枚星片散落在走廊和月台，通往外面的夢路一條條暗了下來。"},{scene:"阿露的請求",speaker:"小夢魔 阿露",text:"旅人，請你幫我找回星鐘指針。我會陪著你讀地圖、認識旅伴；遇到守路的夢獸時，速率就是我們的戰鬥線索。"},{scene:"選擇你的旅人職業",speaker:"星鐘公會・入會登記",text:"每位守望者都可以挑一種出發方式。你的選擇會改變道具袋和生命值。",choice:true}];beginDialogue(intro,showPretest)}

function renderPretest(){state.phase="pretest";hud();const q=pretest[state.preIndex];shell(`<div class="paper-card"><p class="eyebrow">📜　公會入會紀錄　｜　前測 ${state.preIndex+1} / 3</p><h2>先試試你的直覺</h2><p>${esc(q.q)}</p><div class="answer-grid">${q.options.map((o,i)=>`<button class="answer" data-answer="${i}"><span>${String.fromCharCode(65+i)}.</span>${esc(o)}</button>`).join("")}</div><p class="small">這是旅程前的紀錄，不扣生命、不公布對錯。</p></div>`);screen.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{if(+b.dataset.answer===q.answer)state.preScore++;state.preIndex++;if(state.preIndex<pretest.length)renderPretest();else beginDialogue([{scene:"入會測驗完成",speaker:"公會登記員",text:"謝謝你先用自己的想法完成測驗。接下來會在旅途中練習，最後再用新題目看看星鐘之旅帶來哪些進步。"},{scene:"夢路亮起",speaker:"小夢魔 阿露",text:"六枚星片分散在兩章、六個節點。每解決一場遭遇就能拿到鑰匙和經驗值；答案不對時，先守住心火，再看提示找出新線索。"}],showMap)});talk("公會登記員","先用目前會的方法作答。前測只記錄起點，不扣生命。",false)}
function showMap(){state.phase="map";state.chapter=state.chapter2?1:0;hud();const cards=chapters.map((ch,c)=>{const locked=c===1&&!state.chapter2;const nodes=ch.encounters.map((e,i)=>{const n=c*3+i,done=state.done[n],open=!locked&&n<=state.unlocked;return `<button class="node ${done?"completed":open?"unlocked":"locked"}" ${open?`data-node="${n}"`:"disabled"}><em>${done?"🔑":locked?"🔒":e.emoji}</em><b>${esc(e.name)}</b><small>${done?"已完成・鑰匙取得":open?"點選出發": "尚未探索"}</small></button>`}).join("");return `<section class="chapter ${locked?"locked-chapter":""}"><div class="chapter-head"><strong>${ch.icon} ${esc(ch.name)}</strong><span>${c===0?state.keys[0]:locked?"—":state.keys[1]} / 3 星片</span></div><div class="route">${nodes}</div></section>`}).join("");shell(`<div class="paper-card"><div class="route-title"><div><p class="eyebrow">🗺️　夢境地圖</p><h2>選擇你的下一站</h2></div><span class="sub">經驗值 ${state.xp} XP</span></div><p>已完成的節點會留下星片；沿著亮起的路標前進，六把鑰匙就能修好星鐘。</p>${cards}<div class="badges"><span class="badge">🧭 每站先讀線索</span><span class="badge">⚔️ 速率知識是你的技能</span><span class="badge">🪄 解題後獲得經驗</span></div></div>`);screen.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>startNode(+b.dataset.node));talk("小夢魔 阿露",state.chapter2?"星光月台已經開放！完成剩下的節點，就能找回指針。":"第一條夢路已經亮起。先從燈火走廊出發吧。",false);hud()}

function showBattle(){state.phase="battle";hud();const e=state.current;const q=e;const answerHtml=Object.hasOwn(q,"number")?`<form id="answer-form" class="number-row"><label class="sr" for="answer-number">輸入答案</label><input id="answer-number" type="number" inputmode="decimal" step="any" placeholder="輸入數字" required><span class="unit">${esc(q.unit)}</span><button class="primary" type="submit">施展技能　✦</button></form>`:`<div class="answer-grid">${q.options.map((o,i)=>`<button class="answer" data-answer="${i}"><span>${String.fromCharCode(65+i)}.</span>${esc(o)}</button>`).join("")}</div>`;shell(`<div class="paper-card"><p class="eyebrow">⚔️　遭遇戰　｜　${esc(chapters[state.chapter].name)}・節點 ${state.encounter+1}</p><div class="battle"><div class="enemy-card"><div class="enemy-icon" aria-hidden="true">${e.emoji}</div><div class="enemy-name">${esc(e.name)}</div><div class="enemy-hp"><i style="width:${state.enemyHp}%"></i></div><small>夢獸心力 ${state.enemyHp} / 100</small></div><div class="battle-main"><h2>${esc(q.q)}</h2><p>把距離、時間和速率當成戰鬥線索，選擇或輸入你的技能答案。</p>${answerHtml}${state.hintText?`<div class="hint-box">🗺️ ${esc(state.hintText)}</div>`:""}<div class="battle-actions"><span class="small">連續作答：${state.attempts} 次　｜　答對就能取得本節點鑰匙</span><button class="soft" id="retreat">查看地圖</button></div></div></div></div>`);screen.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>resolveAnswer(+b.dataset.answer));const form=$("#answer-form");if(form)form.onsubmit=e=>{e.preventDefault();const input=$("#answer-number");if(!input.value){input.focus();return}resolveAnswer(Math.abs(+input.value-q.number)<1e-7)};$("#retreat").onclick=showMap;talk("小夢魔 阿露",state.attempts?"看著戰鬥線索再試一次；我會陪你把路打開。":"輪到你行動了！答案越接近正確，星火就越亮。",false);hud()}
function resolveAnswer(value){const q=state.current;const correct=Object.hasOwn(q,"number")?value===true:value===q.answer;state.attempts++;if(correct){const pts=Math.max(40,100-(state.attempts-1)*30);state.score[state.chapter]+=pts;state.keys[state.chapter]++;state.done[state.node]=true;state.unlocked=Math.max(state.unlocked,state.node+1);state.xp+=25;state.level=Math.floor(state.xp/100)+1;state.enemyHp=0;showVictory(pts)}else{state.hp--;let recovery="";if(state.hp<=0){state.hp=1;recovery="阿露燃起一簇星火，讓你恢復 1 顆心。"}state.hintText=state.attempts===1?q.hint:q.why;showBattle();talk("小夢魔 阿露",`這次沒有命中，${recovery} 看看線索，再試一個方法。`,false)}hud()}
function showVictory(pts){state.phase="victory";hud();const e=state.current;shell(`<div class="paper-card"><p class="eyebrow">✦　遭遇完成　✦</p><h2>${esc(e.name)}退到一旁，星路亮了起來！</h2><p class="story-text">${esc(e.outro)}</p><div class="reward-line"><span class="reward-icon">🔑</span><span>取得星片鑰匙　＋${pts} 分　＋25 XP</span></div><div class="badges"><span class="badge">目前等級 Lv. ${state.level}</span><span class="badge">本章鑰匙 ${state.keys[state.chapter]} / 3</span></div><button class="primary" id="continue">收下獎勵，繼續探索　›</button></div>`);$("#continue").onclick=continueVictory;talk(e.name,e.outro,true,"收下獎勵　›");hud()}
function continueVictory(){if(state.node===2){beginDialogue([{scene:"燈火走廊的門開了",speaker:"阿澄",text:`三枚星片在地圖上合成第一把大鑰匙！我們拿到 ${state.score[0]} 分，也讓通往月台的夢路亮起來了。`},{scene:"前往星光月台",speaker:"小夢魔 阿露",text:"下一章會遇到不同單位和更難的比較。記得先讀站牌，換算成相同單位再行動。"}],()=>{state.chapter2=true;state.unlocked=3;showMap()})}else if(state.node===5){beginDialogue([{scene:"指針回到星鐘",speaker:"星鐘守望者",text:"六枚星片歸位，星鐘重新轉動！最後請完成三個新的校準任務，看看這趟旅程讓你進步多少。"}],()=>{state.postIndex=0;showPosttest()})}else showMap()}
function usePotion(){if(state.potion<1||state.hp===state.maxHp)return;state.potion--;state.hp=Math.min(state.maxHp,state.hp+2);talk("小夢魔 阿露","月露藥水回復了兩顆心！帶著精神繼續冒險。",false);hud()}
function useHint(){if(state.hints<1||state.phase!=="battle"||!state.current)return;state.hints--;state.hintText=state.current.why;showBattle();talk("小夢魔 阿露","星圖把這一題的計算路線照亮了。",false);hud()}
function showPosttest(){state.phase="posttest";hud();const q=posttest[state.postIndex];shell(`<div class="paper-card"><p class="eyebrow">🌟　星鐘最後校準　｜　${state.postIndex+1} / 3</p><h2>最後一項守望任務</h2><p>${esc(q.q)}</p><div class="answer-grid">${q.options.map((o,i)=>`<button class="answer" data-answer="${i}"><span>${String.fromCharCode(65+i)}.</span>${esc(o)}</button>`).join("")}</div></div>`);screen.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{if(+b.dataset.answer===q.answer)state.postScore++;state.postIndex++;if(state.postIndex<posttest.length)showPosttest();else finalScreen()});talk("阿露", "用旅途中學會的公式，完成星鐘校準。",false);hud()}
function finalScreen(){state.phase="final";state.chapter=2;hud();const diff=state.postScore-state.preScore;const msg=diff>0?`後測多答對 ${diff} 題。你一路讀故事、找線索、修正方法，讓自己的速率技能升級了！`:diff===0?"前後測答對題數相同；你完成了六場冒險，也練習了速率的不同解法。":`後測少答對 ${Math.abs(diff)} 題。別灰心，重走星圖並留意單位換算，就能再挑戰。`;shell(`<div class="paper-card"><p class="eyebrow">🏆　星鐘守望者・旅程紀錄</p><h2>夢路重新亮起來了！</h2><p class="lead">${esc(msg)}</p><div class="final-grid"><div class="result"><strong>出發前・前測</strong><b>${state.preScore} / 3 題</b><div class="meter"><i style="width:${state.preScore/3*100}%"></i></div></div><div class="result"><strong>旅程後・後測</strong><b>${state.postScore} / 3 題</b><div class="meter"><i style="width:${state.postScore/3*100}%"></i></div></div></div><div class="reward-line"><span class="reward-icon">⭐</span><span>第一章 ${state.score[0]} / 300　·　第二章 ${state.score[1]} / 300　·　總經驗 ${state.xp} XP</span></div><div class="badges"><span class="badge">🔑 星片 ${totalKeys()} / 6</span><span class="badge">⚔️ 完成六場遭遇</span><span class="badge">🌙 ${esc(state.role)}</span></div><button class="primary" id="again">重新踏上夢路　↻</button></div>`);$("#again").onclick=()=>title();talk("小夢魔 阿露","星鐘又開始轉動啦！謝謝你陪我完成這趟夢旅。",false);hud()}
function advance(){if(state.phase==="dialogue")advanceDialogue()}
action.addEventListener("click",advance);
function initSide(){hud()}
title();
</script>
</body>
